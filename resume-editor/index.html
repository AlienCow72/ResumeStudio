<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Resume Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f3;color:#213b36;font:14px system-ui,sans-serif}header{padding:22px 32px;background:#fff;border-bottom:1px solid #d9e2de;display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:23px;margin:0}header p{margin:4px 0 0;color:#6b7d76;font-size:12px}.actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{font:inherit;border:1px solid #cbd8d1;border-radius:7px;background:white;color:#24483e;padding:9px 12px;cursor:pointer}button:hover{background:#e8f2ed}button.primary{background:#176b56;color:#fff;border-color:#176b56}button:disabled{opacity:.45;cursor:default}main{display:grid;grid-template-columns:185px minmax(340px,1fr) minmax(360px,1.1fr);height:calc(100vh - 110px)}nav{padding:23px 12px;overflow:auto}nav button{display:block;width:100%;text-align:left;margin-bottom:5px;border:0;background:transparent}nav button.active{background:#dcebe3;font-weight:650}#editPane{padding:26px;overflow:auto}h2{margin:0 0 6px;font-size:22px}.hint{color:#697970;margin:0 0 23px;line-height:1.5}.field{display:block;margin-bottom:13px}.field>span{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:#587166}input,textarea{width:100%;border:1px solid #ccd8d1;border-radius:6px;background:white;padding:10px;font:14px/1.5 system-ui;color:#233c32}textarea{min-height:90px;resize:vertical}input:focus,textarea:focus{outline:2px solid #64a58f}fieldset{border:1px solid #d6e0da;border-radius:10px;background:#fff;padding:17px;margin:16px 0}legend{padding:0 7px;font-weight:600}.row{display:flex;gap:6px;justify-content:flex-end;margin-bottom:10px}.row button{padding:5px 9px;font-size:12px}.preview{padding:22px;background:#e2e9e5;border-left:1px solid #d4ddd7;display:flex;flex-direction:column;min-height:0}.preview p{font-size:11px;letter-spacing:1.4px;margin:0 0 13px;font-weight:600}iframe{width:100%;flex:1;border:0;background:white;border-radius:5px;box-shadow:0 6px 25px #213b3610}#status{font-size:12px;color:#49695b;min-width:90px}#status.error{color:#ae382b}#raw{min-height:60vh;font-family:monospace}#exportMenu{position:absolute;right:30px;top:85px;padding:10px;background:white;box-shadow:0 8px 30px #173c3030;border-radius:10px;z-index:2}#exportMenu button{display:block;width:190px;text-align:left;margin:4px}#exportMenu[hidden]{display:none}@media(max-width:1050px){main{grid-template-columns:155px 1fr}.preview{grid-column:1/-1;height:800px}main{height:auto}#editPane{max-height:80vh}}@media(max-width:550px){main{display:block}nav{display:flex;overflow:auto;padding:10px}nav button{white-space:nowrap;width:auto}header{padding:18px}.actions{margin:0}#editPane{padding:18px}}
</style></head><body><header><div><h1>Resume Studio <span style="font-size:11px;color:#709080">LOCAL</span></h1><p>Your experience. One source. Every format.</p></div><div class="actions"><span id="status" role="status">Loading…</span><button id="save" class="primary" disabled>Save changes</button><button id="export" disabled aria-expanded="false">Export ↓</button></div><div id="exportMenu" hidden><button data-format="json">JSON · editable data</button><button data-format="md">Markdown · plain document</button><button data-format="html">HTML · printable document</button><button data-format="pdf">PDF · ready to share</button></div></header><main><nav id="nav" aria-label="Resume sections"></nav><section id="editPane"><h2 id="sectionTitle"></h2><p class="hint">Edit your information below. Blank optional fields are omitted. Dates: YYYY, YYYY-MM, or YYYY-MM-DD.</p><div id="fields"></div></section><section class="preview"><p>DOCUMENT PREVIEW</p><iframe id="preview" title="Resume preview" sandbox=""></iframe></section></main><script>
const schemas={basics:{name:'',label:'',email:'',phone:'',url:'',summary:'',location:{address:'',postalCode:'',city:'',region:'',countryCode:''},profiles:[{network:'',username:'',url:''}]},work:{name:'',position:'',location:'',url:'',startDate:'',endDate:'',summary:'',highlights:['']},education:{institution:'',studyType:'',area:'',startDate:'',endDate:'',score:'',url:'',courses:['']},skills:{name:'',level:'',keywords:['']},projects:{name:'',description:'',startDate:'',endDate:'',url:'',highlights:[''],keywords:[''],roles:[''],entity:'',type:''},volunteer:{organization:'',position:'',startDate:'',endDate:'',summary:'',url:'',highlights:['']},certificates:{name:'',issuer:'',date:'',url:''},awards:{title:'',awarder:'',date:'',summary:''},publications:{name:'',publisher:'',releaseDate:'',url:'',summary:''},languages:{language:'',fluency:''},interests:{name:'',keywords:['']},references:{name:'',reference:''}};
let data,revision,section='basics',dirty=false,timer,previewVersion=0,rawInvalid=false;
const $=id=>document.getElementById(id), title=k=>k.replace(/([a-z])([A-Z])/g,'$1 $2').replace(/^./,c=>c.toUpperCase());
function status(s,error=false){$('status').textContent=s;$('status').className=error?'error':''}
function changed(){dirty=true;status('Unsaved changes');clearTimeout(timer);timer=setTimeout(preview,250)}
async function post(path){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:clean(data)||{},revision})});if(!r.ok)throw Error((await r.json()).error||'Request failed');return r}
async function preview(){const version=++previewVersion;try{const r=await post('preview');const content=await r.text();if(version===previewVersion)$('preview').srcdoc=content}catch(e){status(e.message,true)}}
function button(text,fn){const b=document.createElement('button');b.textContent=text;b.onclick=fn;return b}
function render(){const nav=$('nav');nav.replaceChildren();for(const key of [...Object.keys(schemas),'raw']){const b=button(key==='raw'?'Advanced JSON':title(key),()=>{if(rawInvalid){status('Fix JSON before switching sections',true);return}section=key;render()});b.className=section===key?'active':'';nav.append(b)}$('sectionTitle').textContent=section==='raw'?'Advanced JSON':title(section);const fields=$('fields');fields.replaceChildren();if(section==='raw'){const hint=document.createElement('p');hint.textContent='Edit any field, including custom properties. Valid JSON is applied to the draft immediately.';fields.append(hint);const t=document.createElement('textarea');t.id='raw';t.setAttribute('aria-label','Full resume JSON');t.value=JSON.stringify(data,null,2);t.oninput=()=>{try{const v=JSON.parse(t.value);if(!v||Array.isArray(v)||typeof v!=='object')throw Error('Use a JSON object');data=v;rawInvalid=false;$('save').disabled=false;$('export').disabled=false;changed()}catch(e){rawInvalid=true;$('save').disabled=true;$('export').disabled=true;status('Invalid JSON: '+e.message,true)}};fields.append(t);return}if(section==='basics'){data.basics??={};objectFields(fields,data.basics,schemas.basics)}else{data[section]??=[];arrayFields(fields,data[section],schemas[section],title(section))}}
function objectFields(parent,obj,schema){for(const key of new Set([...Object.keys(schema||{}),...Object.keys(obj)])){const value=obj[key],template=schema?.[key];if(Array.isArray(value)||Array.isArray(template)){const f=document.createElement('fieldset'),l=document.createElement('legend');l.textContent=title(key);f.append(l);obj[key]??=[];arrayFields(f,obj[key],template?.[0]??'',title(key));parent.append(f)}else if((value&&typeof value==='object')||(template&&typeof template==='object')){const f=document.createElement('fieldset'),l=document.createElement('legend');l.textContent=title(key);f.append(l);obj[key]??={};objectFields(f,obj[key],template||{});parent.append(f)}else{const label=document.createElement('label');label.className='field';const name=document.createElement('span');name.textContent=title(key);const input=document.createElement(['summary','description','reference'].includes(key)?'textarea':'input');input.value=value??'';input.oninput=()=>{if(input.value==='')delete obj[key];else obj[key]=typeof value==='number'?Number(input.value):typeof value==='boolean'?input.value==='true':input.value;changed()};label.append(name,input);parent.append(label)}}}
function arrayFields(parent,arr,template,label){arr.forEach((value,i)=>{const card=document.createElement('fieldset');const legend=document.createElement('legend');legend.textContent=typeof value==='object'?(value.name||value.position||value.institution||`${label} ${i+1}`):`${label} ${i+1}`;card.append(legend);const row=document.createElement('div');row.className='row';const up=button('↑',()=>{[arr[i-1],arr[i]]=[arr[i],arr[i-1]];changed();render()});up.disabled=i===0;up.setAttribute('aria-label','Move item up');const down=button('↓',()=>{[arr[i+1],arr[i]]=[arr[i],arr[i+1]];changed();render()});down.disabled=i===arr.length-1;down.setAttribute('aria-label','Move item down');row.append(up,down,button('Remove',()=>{if(confirm('Remove this item?')){arr.splice(i,1);changed();render()}}));card.append(row);if(value&&typeof value==='object')objectFields(card,value,typeof template==='object'?template:{});else{const t=document.createElement('textarea');t.setAttribute('aria-label',`${label} ${i+1}`);t.value=value;t.oninput=()=>{arr[i]=t.value;changed()};card.append(t)}parent.append(card)});parent.append(button('+ Add '+label.toLowerCase(),()=>{arr.push(typeof template==='object'?{}:'');changed();render()}))}
// Remove form scaffolding without discarding unknown fields or meaningful false/zero values.
function clean(v){if(Array.isArray(v))return v.map(clean).filter(x=>x!==undefined);if(v&&typeof v==='object'){const out={};for(const[k,x]of Object.entries(v)){const c=clean(x);if(c!==undefined)out[k]=c}return Object.keys(out).length?out:undefined}return v===''?undefined:v}
$('save').onclick=async()=>{try{$('save').disabled=true;const r=await post('save');revision=(await r.json()).revision;dirty=false;status('Saved · backup created')}catch(e){status(e.message,true)}finally{$('save').disabled=false}};
$('export').onclick=()=>{const menu=$('exportMenu');menu.hidden=!menu.hidden;$('export').setAttribute('aria-expanded',String(!menu.hidden))};
document.querySelectorAll('[data-format]').forEach(b=>b.onclick=async()=>{try{const r=await post('export/'+b.dataset.format);const url=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=url;a.download='resume.'+b.dataset.format;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);$('exportMenu').hidden=true;$('export').setAttribute('aria-expanded','false');status('Exported '+b.dataset.format.toUpperCase()+(dirty?' · unsaved draft':''))}catch(e){status(e.message,true)}});
window.addEventListener('beforeunload',e=>{if(dirty||rawInvalid){e.preventDefault();e.returnValue=''}});
fetch('/api/resume').then(r=>{if(!r.ok)throw Error('Unable to load resume.json');return r.json()}).then(v=>{data=v.data;revision=v.revision;render();preview();status('All changes saved');$('save').disabled=false;$('export').disabled=false}).catch(e=>status(e.message,true));
</script></body></html>
